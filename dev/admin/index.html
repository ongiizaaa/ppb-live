<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FF6B00">
<title>[DEV] หลังบ้าน — Powerpointboy Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400..700&display=swap">
<style>
/* Layout: host = sidebar + work area · screen = 16:9 stage scaled by container units · phone = single column card stack */
:root {
  --bg: #F4F6FA;
  --surface: #FFFFFF;
  --surface-2: #EEF2F8;
  --ink: #13213B;
  --ink-2: #4B5A78;
  --ink-3: #8592AB;
  --line: #DCE2EC;
  --brand: #FF6B00;
  --brand-ink: #C24E00;
  --brand-soft: #FFEEDF;
  --on-brand: #FFFFFF;
  --navy: #1B3A6B;
  --navy-soft: #E3EAF5;
  --bar: #1B3A6B;
  --track: #EBEFF6;
  --good: #128A47;
  --good-soft: #DDF3E6;
  --bad: #D33A3F;
  --bad-soft: #FBE3E3;
  --shadow: 0 1px 2px rgba(19, 33, 59, .06), 0 6px 20px -8px rgba(19, 33, 59, .18);
  --bezel: #16233D;
  --f-display: 'Google Sans', 'Noto Sans Thai', system-ui, sans-serif;
  --f-body: 'Google Sans', 'Noto Sans Thai', system-ui, sans-serif;
  --f-mono: 'Google Sans', 'Noto Sans Thai', system-ui, sans-serif;
  --r: 12px;
  --r-sm: 8px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0B1322; --surface: #121D31; --surface-2: #1A2740; --ink: #ECF1F9; --ink-2: #A6B3CB; --ink-3: #6E7D99;
    --line: #26344F; --brand: #FF7A1A; --brand-ink: #FF9C55; --brand-soft: #3A2312; --on-brand: #1B0E04;
    --navy: #8FB0E8; --navy-soft: #1E2E4C; --bar: #7FA2DE; --track: #1C2943; --good: #3CCB7F; --good-soft: #143424;
    --bad: #FF6B6F; --bad-soft: #3A1A1D; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -10px rgba(0,0,0,.6); --bezel: #2C3B5A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0B1322; --surface: #121D31; --surface-2: #1A2740; --ink: #ECF1F9; --ink-2: #A6B3CB; --ink-3: #6E7D99;
  --line: #26344F; --brand: #FF7A1A; --brand-ink: #FF9C55; --brand-soft: #3A2312; --on-brand: #1B0E04;
  --navy: #8FB0E8; --navy-soft: #1E2E4C; --bar: #7FA2DE; --track: #1C2943; --good: #3CCB7F; --good-soft: #143424;
  --bad: #FF6B6F; --bad-soft: #3A1A1D; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -10px rgba(0,0,0,.6); --bezel: #2C3B5A;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
[hidden] { display: none !important; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--f-display); line-height: 1.25; margin: 0; text-wrap: balance; }
p { margin: 0; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-2); }
.faint { color: var(--ink-3); }
svg.i { width: 1.15em; height: 1.15em; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; vertical-align: -0.2em; }

.app { min-height: 100%; display: flex; flex-direction: column; }
.app.full { height: 100%; }

/* ---------- controls ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: .45em; padding: .55em 1em; border-radius: var(--r-sm); border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-weight: 500; line-height: 1.2; white-space: nowrap; transition: background .15s, border-color .15s, transform .1s; text-decoration: none; }
.btn:hover { border-color: var(--ink-3); }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }
.btn.primary { background: var(--brand); border-color: var(--brand); color: var(--on-brand); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.06); }
.btn.navy { background: var(--navy); border-color: var(--navy); color: var(--surface); font-weight: 600; }
.btn.ghost { background: transparent; border-color: transparent; color: var(--ink-2); }
.btn.ghost:hover { background: var(--surface-2); color: var(--ink); }
.btn.danger { color: var(--bad); }
.btn.danger.solid { background: var(--bad); border-color: var(--bad); color: #fff; }
.btn.sm { padding: .35em .7em; font-size: .88em; }
.btn.lg { padding: .8em 1.3em; font-size: 1.05em; }
.btn.block { width: 100%; }
.icon-btn { display: inline-grid; place-items: center; width: 2.1em; height: 2.1em; border-radius: var(--r-sm); border: 0; background: transparent; color: var(--ink-2); }
.icon-btn:hover { background: var(--surface-2); color: var(--ink); }
.input, .textarea, .select { width: 100%; padding: .6em .8em; border-radius: var(--r-sm); border: 1px solid var(--line); background: var(--surface); transition: border-color .15s, box-shadow .15s; }
.input:focus, .textarea:focus, .select:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
.textarea { resize: vertical; min-height: 4.5em; line-height: 1.5; }
.label { display: block; font-size: .8em; font-weight: 600; letter-spacing: .02em; color: var(--ink-2); margin-bottom: .35em; }
.pill { display: inline-flex; align-items: center; gap: .35em; padding: .15em .6em; border-radius: 99px; font-size: .78em; font-weight: 600; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
.pill.live { background: var(--brand-soft); color: var(--brand-ink); }
.pill.live::before { content: ''; width: .5em; height: .5em; border-radius: 50%; background: var(--brand); animation: pulse 1.6s infinite; }
.pill.good { background: var(--good-soft); color: var(--good); }
.pill.navy { background: var(--navy-soft); color: var(--navy); }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
.toggle { display: inline-flex; align-items: center; gap: .5em; cursor: pointer; user-select: none; font-size: .92em; }
.toggle input { appearance: none; width: 2.3em; height: 1.3em; border-radius: 99px; background: var(--line); position: relative; transition: background .15s; cursor: pointer; margin: 0; flex: none; }
.toggle input::after { content: ''; position: absolute; top: .15em; left: .15em; width: 1em; height: 1em; border-radius: 50%; background: var(--surface); transition: transform .15s; box-shadow: 0 1px 2px rgba(0,0,0,.25); }
.toggle input:checked { background: var(--brand); }
.toggle input:checked::after { transform: translateX(1em); }

.toast-wrap { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); display: flex; flex-direction: column; gap: 8px; z-index: 1000; pointer-events: none; width: max-content; max-width: calc(100% - 32px); }
.toast { background: var(--ink); color: var(--surface); padding: .6em 1em; border-radius: var(--r-sm); font-size: .92em; box-shadow: var(--shadow); animation: toastIn .2s ease-out; }
.toast.bad { background: var(--bad); color: #fff; }
@keyframes toastIn { from { opacity: 0; transform: translateY(8px); } }

/* ---------- brand ---------- */
.brand { display: inline-flex; align-items: center; gap: .55em; font-family: var(--f-display); font-weight: 600; letter-spacing: -.01em; color: var(--ink); text-decoration: none; white-space: nowrap; }
.brand .mark { width: 1.75em; height: 1.75em; flex: none; }
.brand b { color: var(--brand); font-weight: 700; }

/* ---------- mode banner + demo nav ---------- */
.modebar { display: flex; align-items: center; gap: 12px 16px; flex-wrap: wrap; padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--line); }
.modebar .note { font-size: .85em; color: var(--ink-2); display: flex; align-items: center; gap: .5em; min-width: 0; }
.modebar .spacer { flex: 1; }
.seg { display: inline-flex; padding: 3px; border-radius: 10px; background: var(--surface-2); gap: 2px; flex-wrap: wrap; }
.seg a, .seg button { border: 0; background: transparent; padding: .38em .85em; border-radius: 8px; font-size: .88em; font-weight: 500; color: var(--ink-2); text-decoration: none; white-space: nowrap; }
.seg a:hover, .seg button:hover { color: var(--ink); }
.seg .on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(19,33,59,.12); }

/* ---------- home ---------- */
.home { width: 100%; max-width: 1100px; margin: 0 auto; padding: 48px clamp(16px, 5vw, 72px) 72px; display: grid; gap: 28px; align-content: start; }
.home-hero { display: grid; gap: 10px; }
.home-hero h1 { font-size: clamp(1.8rem, 4vw, 2.6rem); font-weight: 700; letter-spacing: -.02em; }
.home-hero p { color: var(--ink-2); max-width: 60ch; font-size: 1.05em; }
.home-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 16px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 22px; display: grid; gap: 14px; align-content: start; }
.card h2 { font-size: 1.15em; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.row > .input { flex: 1; min-width: 0; }
.codebox { font-family: var(--f-mono); font-size: 1.4em; letter-spacing: .12em; text-align: center; }
.roomlist { display: grid; gap: 6px; }
.roomlist a { display: flex; gap: 12px; align-items: center; justify-content: space-between; padding: 10px 12px; border-radius: var(--r-sm); background: var(--surface-2); text-decoration: none; color: var(--ink); min-width: 0; }
.roomlist a span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.roomlist a:hover { background: var(--navy-soft); }

/* ---------- host ---------- */
.host { flex: 1; width: 100%; max-width: 1440px; margin: 0 auto; padding: 28px clamp(16px, 4.5vw, 64px) 56px; display: grid; grid-template-columns: 280px minmax(0, 1fr); grid-template-rows: auto 1fr; gap: 20px; align-items: start; }
.host-top { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px 14px; flex-wrap: wrap; padding: 12px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.host-top .title-input { border: 1px solid transparent; background: transparent; font-family: var(--f-display); font-weight: 600; font-size: 1.1em; padding: .25em .5em; border-radius: var(--r-sm); min-width: 0; flex: 1 1 180px; max-width: 420px; }
.host-top .title-input:hover { border-color: var(--line); }
.host-top .title-input:focus { outline: none; border-color: var(--brand); background: var(--surface); }
.code-chip { display: inline-flex; align-items: center; gap: .5em; padding: .35em .75em; border-radius: var(--r-sm); background: var(--navy-soft); color: var(--navy); font-family: var(--f-mono); font-weight: 600; border: 0; letter-spacing: .06em; }
.host-top .spacer { flex: 1; }
.host-top .stat { display: inline-flex; align-items: center; gap: .4em; color: var(--ink-2); font-size: .9em; white-space: nowrap; }
.host-side { border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); padding: 14px 12px; display: flex; flex-direction: column; gap: 6px; overflow-y: auto; position: sticky; top: 16px; max-height: calc(100dvh - 32px); }
.side-label { font-size: .75em; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); padding: 8px 8px 4px; }
.qitem { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 9px 10px; border-radius: 10px; border: 1px solid transparent; cursor: pointer; text-align: left; background: transparent; width: 100%; }
.qitem:hover { background: var(--surface-2); }
.qitem.sel { background: var(--brand-soft); border-color: color-mix(in srgb, var(--brand) 35%, transparent); }
.qitem .ticon { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; background: var(--surface-2); color: var(--navy); }
.qitem.sel .ticon { background: var(--surface); }
.qitem .qt { font-size: .9em; line-height: 1.35; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.qitem .qmeta { font-size: .75em; color: var(--ink-3); display: flex; gap: 6px; align-items: center; margin-top: 2px; }
.qitem .ord { display: none; flex-direction: column; }
.qitem:hover .ord, .qitem.sel .ord { display: flex; }
.qitem .ord button { border: 0; background: transparent; color: var(--ink-3); padding: 0 2px; line-height: 1; }
.qitem .ord button:hover { color: var(--ink); }
.typegrid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 6px 2px; }
.typecard { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; padding: 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); text-align: left; font-weight: 500; font-size: .9em; }
.typecard:hover { border-color: var(--brand); }
.typecard svg { width: 22px; height: 22px; }
.t-mc, .qitem .ticon.t-mc { color: #2F7D4F; } .t-cloud, .qitem .ticon.t-cloud { color: #7C4DBF; } .t-open, .qitem .ticon.t-open { color: #1F7A8C; } .t-quiz, .qitem .ticon.t-quiz { color: #B36A00; } .t-qa, .qitem .ticon.t-qa { color: #C2372E; }
:root[data-theme="dark"] .t-mc, :root[data-theme="dark"] .t-cloud, :root[data-theme="dark"] .t-open, :root[data-theme="dark"] .t-quiz, :root[data-theme="dark"] .t-qa { filter: brightness(1.6); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) :is(.t-mc, .t-cloud, .t-open, .t-quiz, .t-qa) { filter: brightness(1.6); } }

.host-main { min-width: 0; display: grid; grid-template-columns: minmax(0, 380px) minmax(0, 1fr); gap: 20px; align-content: start; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; display: grid; gap: 16px; align-content: start; min-width: 0; }
.panel-head { display: flex; align-items: center; gap: 10px; justify-content: space-between; flex-wrap: wrap; }
.panel-head h3 { font-size: 1em; display: flex; align-items: center; gap: .5em; }
.optrow { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 8px; align-items: center; }
.optrow .letter { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; font-weight: 600; font-family: var(--f-display); background: var(--surface-2); color: var(--ink-2); border: 2px solid transparent; }
.optrow .letter.correct { background: var(--good-soft); color: var(--good); border-color: var(--good); }
.optrow .letter.pick { cursor: pointer; }
.optrow .letter.pick:hover { border-color: var(--good); }
.hint { font-size: .82em; color: var(--ink-3); }
.warn { font-size: .85em; color: var(--brand-ink); background: var(--brand-soft); padding: .55em .8em; border-radius: var(--r-sm); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.ctrlbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.confirm { display: inline-flex; gap: 6px; align-items: center; font-size: .9em; flex-wrap: wrap; }
.preview-frame { border-radius: 10px; overflow: hidden; border: 1px solid var(--line); background: var(--bg); }
.modlist { display: grid; gap: 6px; max-height: 360px; overflow-y: auto; }
.moditem { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 10px; border-radius: var(--r-sm); background: var(--surface-2); font-size: .92em; }
.moditem.off { opacity: .45; text-decoration: line-through; }
.moditem .acts { display: flex; gap: 2px; }
.qa-host-item { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: start; padding: 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); }
.qa-host-item.star { border-color: var(--brand); background: var(--brand-soft); }
.qa-host-item.done { opacity: .55; }
.votes { display: grid; justify-items: center; min-width: 2.6em; font-family: var(--f-display); font-weight: 600; color: var(--navy); line-height: 1.1; }
.votes small { font-size: .7em; font-weight: 500; color: var(--ink-3); font-family: var(--f-body); }
.empty { padding: 28px 16px; text-align: center; color: var(--ink-3); font-size: .92em; display: grid; gap: 8px; justify-items: center; }
.pinbox { display: inline-flex; align-items: center; gap: .4em; font-size: .85em; color: var(--ink-2); }

@media (max-width: 1100px) {
  .host-main { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 760px) {
  .host { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto 1fr; padding: 12px 12px 40px; gap: 12px; }
  .host-side { position: static; max-height: 300px; }
}

/* ---------- stage (projector) ---------- */
.stage { position: relative; container-type: size; width: 100%; background: var(--room, var(--surface)); color: var(--ink); overflow: hidden; }
.stage.fit { aspect-ratio: 16 / 9; max-width: 100%; }
.stage.full { height: 100%; }
.stage-inner { position: absolute; inset: 0; font-size: min(3cqh, 1.7cqw); display: grid; grid-template-rows: auto minmax(0, 1fr) auto; padding: .9em 1.5em .7em; gap: .6em; }
.rail { display: flex; align-items: center; justify-content: space-between; gap: 1em; min-height: 2.6em; }
.rail .ev { font-size: .78em; color: var(--ink-2); font-weight: 500; display: flex; align-items: center; gap: .6em; min-width: 0; }
.rail .ev span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rail .join { display: flex; align-items: center; gap: .8em; font-size: .78em; color: var(--ink-2); white-space: nowrap; }
.rail .join b { color: var(--ink); font-weight: 600; }
.rail .join .code { font-family: var(--f-mono); color: var(--brand-ink); font-weight: 600; font-size: 1.15em; letter-spacing: .04em; }
.rail .qr { width: 3.2em; height: 3.2em; background: #fff; padding: .2em; border-radius: .3em; }
.qr svg, .qr img { display: block; width: 100%; height: 100%; }
.foot { display: flex; align-items: center; justify-content: space-between; gap: 1em; font-size: .62em; color: var(--on-room, var(--ink-3)); opacity: .8; min-height: 1.4em; }
.foot .cnt { display: inline-flex; align-items: center; gap: .45em; color: var(--ink-2); font-weight: 500; }
.foot .keys { opacity: 0; transition: opacity .3s; }
.stage:hover .foot .keys { opacity: 1; }
.kbd { display: inline-block; padding: 0 .4em; border: 1px solid currentColor; border-radius: .3em; font-family: var(--f-mono); font-size: .9em; margin: 0 .15em; opacity: .85; }
.scene { min-height: 0; display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 1em; animation: sceneIn .35s ease-out; }
@keyframes sceneIn { from { opacity: 0; transform: translateY(.4em); } }
.st-type { display: inline-flex; align-items: center; gap: .45em; font-size: .7em; font-weight: 600; letter-spacing: .05em; color: var(--brand-ink); text-transform: uppercase; }
.st-q { font-family: var(--f-display); font-weight: 700; font-size: 1.6em; line-height: 1.22; letter-spacing: -.01em; text-wrap: balance; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.st-head { display: grid; gap: .35em; }
.st-head.with-timer { grid-template-columns: minmax(0, 1fr) auto; align-items: start; gap: 1.2em; }
.hidden-note { display: grid; place-items: center; align-content: center; gap: .5em; color: var(--ink-3); text-align: center; }
.hidden-note svg { width: 2.4em; height: 2.4em; }
.hidden-note b { font-family: var(--f-display); font-size: 1.3em; color: var(--ink-2); font-weight: 600; }

/* bars */
.bars { display: grid; align-content: center; gap: .7em; min-height: 0; }
.br { display: grid; grid-template-columns: minmax(0, 1fr); row-gap: .3em; }
.br .lab { display: flex; align-items: center; gap: .55em; font-size: .95em; font-weight: 500; min-width: 0; }
.br .lab span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.br .let { font-family: var(--f-display); font-weight: 700; color: var(--ink-3); width: 1.2em; flex: none; }
.br .pct { position: absolute; top: 50%; left: calc(max(var(--w, 0%), .9em) + .5em); transform: translateY(-50%); font-family: var(--f-display); font-weight: 500; font-size: 1.15em; font-variant-numeric: tabular-nums; line-height: 1; white-space: nowrap; transition: left .6s cubic-bezier(.2,.8,.2,1); }
.br .trk { height: 1.3em; margin-right: 3.6em; position: relative; }
.br .fill { position: absolute; inset: 0 auto 0 0; width: 0; min-width: .9em; background: var(--bar-off, var(--bar)); border-radius: 99px; transition: width .6s cubic-bezier(.2,.8,.2,1); }
.br.top .fill { background: var(--brand); }
.br.top .pct { color: var(--brand-ink); }
.br .n { font-size: .6em; color: var(--ink-3); font-weight: 500; margin-left: .3em; }
.bars.dense { gap: .45em; }
.bars.dense .trk { height: .95em; }
.br.correct .fill { background: var(--good); }
.br.correct .pct, .br.correct .let { color: var(--good); }
.br.wrong .fill { background: var(--ink-3); opacity: .45; }
.br.wrong .lab { color: var(--ink-3); }
.br .ok { color: var(--good); }

/* quiz live */
.quiz-opts { display: grid; grid-template-columns: 1fr 1fr; gap: .8em; align-content: center; }
.qopt { display: flex; align-items: center; gap: .7em; padding: .75em 1em; border-radius: .5em; background: var(--surface-2); font-size: 1.12em; font-weight: 500; min-width: 0; }
.qopt .let { width: 1.8em; height: 1.8em; border-radius: .35em; display: grid; place-items: center; font-family: var(--f-display); font-weight: 700; background: var(--navy); color: var(--surface); flex: none; font-size: .85em; }
.qopt span:last-child { overflow: hidden; text-overflow: ellipsis; }
.timer { width: 4.6em; height: 4.6em; position: relative; display: grid; place-items: center; }
.timer svg { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
.timer circle { fill: none; stroke-width: 8; }
.timer .bgc { stroke: var(--track); }
.timer .fgc { stroke: var(--brand); stroke-linecap: round; transition: stroke-dashoffset .25s linear; }
.timer b { font-family: var(--f-display); font-size: 1.6em; font-weight: 700; font-variant-numeric: tabular-nums; }
.timer.done b { font-size: .8em; color: var(--ink-2); }
.answered { display: inline-flex; align-items: baseline; gap: .35em; font-family: var(--f-display); }
.answered b { font-size: 1.4em; }

/* cloud */
.cloud { position: relative; min-height: 0; overflow: hidden; }
.cloud .w { position: absolute; left: 0; top: 0; white-space: nowrap; font-family: var(--f-display); font-weight: 600; line-height: 1; transition: transform .7s cubic-bezier(.2,.8,.2,1), font-size .7s cubic-bezier(.2,.8,.2,1), opacity .4s; will-change: transform; }
.cloud .w.c0 { color: var(--brand); } .cloud .w.c1 { color: var(--navy); } .cloud .w.c2 { color: var(--ink-2); } .cloud .w.c3 { color: var(--brand-ink); } .cloud .w.c4 { color: var(--bar); }
.cloud .w.new { opacity: 0; }

/* open text wall */
.wall { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 13em), 1fr)); gap: .6em; align-content: start; overflow: hidden; min-height: 0; }
.wall .card-o { background: var(--surface-2); border-radius: .45em; padding: .7em .9em; font-size: .82em; line-height: 1.45; animation: popIn .4s cubic-bezier(.2,.9,.3,1.3); overflow-wrap: anywhere; }
.wall.big { grid-template-columns: repeat(auto-fill, minmax(min(100%, 17em), 1fr)); }
.wall.big .card-o { font-size: 1.05em; padding: .9em 1.1em; }
.wall .card-o:first-child { background: var(--brand-soft); }
@keyframes popIn { from { opacity: 0; transform: scale(.92); } }

/* leaderboard */
.board { position: relative; min-height: 0; }
.board .lr { position: absolute; left: 0; right: 0; display: grid; grid-template-columns: 2.2em minmax(0, 1fr) auto; gap: .9em; align-items: center; padding: 0 1em; border-radius: .45em; background: var(--surface-2); transition: transform .7s cubic-bezier(.2,.8,.2,1); }
.board .lr .rk { font-family: var(--f-display); font-weight: 700; color: var(--ink-3); text-align: center; }
.board .lr .nm { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.board .lr .pt { font-family: var(--f-display); font-weight: 700; font-variant-numeric: tabular-nums; }
.board .lr.r1 { background: var(--brand); color: var(--on-brand); }
.board .lr.r1 .rk { color: var(--on-brand); }
.board .lr.r2, .board .lr.r3 { background: var(--navy-soft); }

/* qa on stage */
.qa-st { display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 1em; min-height: 0; }
.qa-feature { background: var(--brand-soft); border-radius: .6em; padding: 1em 1.3em; display: grid; gap: .4em; }
.qa-feature .q { font-family: var(--f-display); font-size: 1.5em; font-weight: 600; line-height: 1.3; }
.qa-feature .by { font-size: .75em; color: var(--ink-2); }
.qa-list { display: grid; gap: .5em; align-content: start; overflow: hidden; min-height: 0; }
.qa-row { display: grid; grid-template-columns: 3em minmax(0, 1fr); gap: .8em; align-items: center; padding: .55em .8em; border-radius: .45em; background: var(--surface-2); font-size: .95em; }
.qa-row .v { font-family: var(--f-display); font-weight: 700; color: var(--navy); text-align: center; display: flex; flex-direction: column; line-height: 1.05; }
.qa-row .v small { font-size: .6em; color: var(--ink-3); font-weight: 500; }
.qa-row .t { overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }

/* join slide */
.joinslide { isolation: isolate; display: grid; grid-template-columns: minmax(0, 1.2fr) auto; gap: 3em; align-items: center; padding: 0 1em; min-height: 0; }
.joinslide .big { display: grid; gap: .6em; }
.joinslide .eyebrow { font-size: .9em; color: var(--ink-2); font-weight: 500; }
.joinslide .url { font-family: var(--f-display); font-size: 1.9em; font-weight: 600; letter-spacing: -.01em; overflow-wrap: anywhere; line-height: 1.2; }
.joinslide .code { font-family: var(--f-mono); font-size: 3.6em; font-weight: 600; color: var(--brand); letter-spacing: .06em; line-height: 1; }
.joinslide .people { display: inline-flex; gap: .5em; align-items: center; color: var(--ink-2); font-size: .9em; }
.joinslide .qrbig { width: min(15em, 52cqh); aspect-ratio: 1; background: #fff; padding: .7em; border-radius: .8em; box-shadow: var(--shadow); position: relative; }
.joinslide .qrbig::before { content: ''; position: absolute; inset: -1.1em -1.1em auto auto; width: 2.6em; height: 2.6em; border-radius: 50%; background: var(--brand); z-index: -1; }
.joinslide .qrbig::after { content: ''; position: absolute; inset: auto auto -.9em -.9em; width: 3.6em; height: 1.2em; border-radius: .3em; background: var(--navy); z-index: -1; }
.joinslide .title { font-family: var(--f-display); font-size: 1.15em; font-weight: 600; color: var(--ink); }
.stage .float-back { position: absolute; top: .8em; left: .8em; z-index: 5; opacity: 0; transition: opacity .3s; font-size: 14px; }
.stage.awake .float-back { opacity: 1; }

/* ---------- phone (participant) ---------- */
.pv { height: 100%; min-height: 100%; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr) auto; background: var(--bg); color: var(--ink); font-size: 16px; container-type: inline-size; position: relative; }
.pv-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 16px; background: var(--surface); border-bottom: 1px solid var(--line); padding-top: max(12px, env(safe-area-inset-top, 0px)); }
.pv-head .t { font-family: var(--f-display); font-weight: 600; font-size: .95em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.pv-head .c { font-family: var(--f-mono); font-size: .78em; color: var(--ink-3); white-space: nowrap; }
.pv-body { overflow-y: auto; padding: 16px; display: grid; gap: 14px; align-content: start; }
.pv-tabs { display: grid; grid-template-columns: 1fr 1fr; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.pv-tabs button { border: 0; background: transparent; padding: 10px 6px 12px; display: grid; justify-items: center; gap: 2px; font-size: .78em; font-weight: 500; color: var(--ink-3); position: relative; }
.pv-tabs button svg { width: 22px; height: 22px; }
.pv-tabs button.on { color: var(--brand-ink); }
.pv-tabs .badge { position: absolute; top: 6px; left: calc(50% + 8px); background: var(--brand); color: var(--on-brand); font-size: .75em; min-width: 18px; height: 18px; border-radius: 9px; display: grid; place-items: center; padding: 0 5px; font-weight: 600; }
.pv-q { font-family: var(--f-display); font-size: 1.2em; font-weight: 600; line-height: 1.35; }
.pv-kind { font-size: .75em; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--brand-ink); display: flex; align-items: center; gap: .4em; }
.opt { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; align-items: center; width: 100%; padding: 14px; border-radius: var(--r); border: 1.5px solid var(--line); background: var(--surface); text-align: left; font-weight: 500; line-height: 1.35; transition: border-color .12s, background .12s; }
.opt .dot { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--ink-3); display: grid; place-items: center; }
.opt.multi .dot { border-radius: 6px; }
.opt.on { border-color: var(--brand); background: var(--brand-soft); }
.opt.on .dot { border-color: var(--brand); background: var(--brand); }
.opt.on .dot::after { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--on-brand); }
.opt.multi.on .dot::after { width: 10px; height: 5px; border-radius: 0; background: transparent; border: solid var(--on-brand); border-width: 0 0 2px 2px; transform: rotate(-45deg) translate(1px, -1px); }
.opt:disabled { cursor: default; }
.qbtns { display: grid; gap: 10px; }
.qbtn { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; align-items: center; padding: 16px 14px; border-radius: var(--r); border: 0; background: var(--surface); box-shadow: inset 0 0 0 1.5px var(--line); text-align: left; font-weight: 500; font-size: 1.02em; line-height: 1.3; }
.qbtn .let { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; font-family: var(--f-display); font-weight: 700; background: var(--navy); color: var(--surface); }
.qbtn:active { box-shadow: inset 0 0 0 2px var(--brand); }
.tbar { height: 6px; border-radius: 3px; background: var(--track); overflow: hidden; }
.tbar i { display: block; height: 100%; background: var(--brand); border-radius: 3px; transition: width .25s linear; }
.tline { display: flex; justify-content: space-between; font-size: .82em; color: var(--ink-2); }
.pv-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 10px; }
.pv-card.center { text-align: center; justify-items: center; padding: 26px 18px; }
.done-mark { width: 52px; height: 52px; border-radius: 50%; background: var(--good-soft); color: var(--good); display: grid; place-items: center; }
.done-mark svg { width: 28px; height: 28px; stroke-width: 2.4; }
.done-mark.bad { background: var(--bad-soft); color: var(--bad); }
.result-big { font-family: var(--f-display); font-size: 1.5em; font-weight: 700; }
.pts { font-family: var(--f-display); font-size: 2.2em; font-weight: 700; color: var(--brand-ink); line-height: 1; font-variant-numeric: tabular-nums; }
.wait { display: grid; justify-items: center; gap: 14px; padding: 40px 12px; text-align: center; color: var(--ink-2); }
.wait-art { width: 120px; height: 90px; position: relative; }
.wait-art i { position: absolute; bottom: 0; width: 22px; border-radius: 5px 5px 2px 2px; background: var(--navy); animation: barUp 1.8s ease-in-out infinite; }
.wait-art i:nth-child(1) { left: 14px; height: 40%; animation-delay: 0s; }
.wait-art i:nth-child(2) { left: 49px; height: 70%; background: var(--brand); animation-delay: .2s; }
.wait-art i:nth-child(3) { left: 84px; height: 55%; animation-delay: .4s; }
@keyframes barUp { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(.6); } }
.wait-art i { transform-origin: bottom; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: .3em; padding: .3em .7em; border-radius: 99px; background: var(--navy-soft); color: var(--navy); font-size: .9em; font-weight: 500; }
.mine { display: grid; gap: 6px; }
.mine div { background: var(--surface-2); border-radius: var(--r-sm); padding: 10px 12px; font-size: .95em; overflow-wrap: anywhere; }
.counter { font-size: .78em; color: var(--ink-3); text-align: right; }
.mini-bars { display: grid; gap: 8px; }
.mini-bars .mb { display: grid; gap: 4px; font-size: .88em; }
.mini-bars .mb .top { display: flex; justify-content: space-between; gap: 8px; }
.mini-bars .mb .top span:first-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mini-bars .mb .trk { height: 8px; border-radius: 4px; background: var(--track); overflow: hidden; }
.mini-bars .mb .trk i { display: block; height: 100%; background: var(--bar-off, var(--bar)); border-radius: 4px; transition: width .5s; }
.mini-bars .mb.me .trk i { background: var(--brand); }
.qa-item { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: start; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; }
.qa-item .by { font-size: .78em; color: var(--ink-3); margin-bottom: 2px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.qa-item .tx { overflow-wrap: anywhere; }
.qa-item.star { border-color: var(--brand); }
.upv { display: grid; justify-items: center; gap: 0; padding: 6px 8px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); font-weight: 600; font-size: .85em; min-width: 46px; }
.upv svg { width: 18px; height: 18px; }
.upv.on { background: var(--brand-soft); border-color: var(--brand); color: var(--brand-ink); }
.sorter { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: .85em; color: var(--ink-2); }
.sorter .seg button { font-size: .95em; }

/* ---------- demo simulator ---------- */
.sim { flex: 1; width: 100%; max-width: 1480px; margin: 0 auto; padding: 20px 16px 40px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 22px; align-items: start; align-content: start; }
.sim-intro { grid-column: 1 / -1; display: flex; gap: 12px 24px; align-items: end; justify-content: space-between; flex-wrap: wrap; }
.sim-intro h1 { font-size: clamp(1.35rem, 2.4vw, 1.75rem); font-weight: 700; letter-spacing: -.01em; }
.sim-intro p { color: var(--ink-2); max-width: 64ch; font-size: .95em; margin-top: 4px; }
.sim-left { display: grid; gap: 12px; min-width: 0; }
.projector { border-radius: 14px; overflow: hidden; box-shadow: var(--shadow); border: 1px solid var(--line); }
.frame-label { font-size: .75em; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); display: flex; align-items: center; gap: .5em; }
.sim-ctrl { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px; }
.sim-ctrl .sep { width: 1px; align-self: stretch; background: var(--line); margin: 0 4px; }
.sim-ctrl .now { font-size: .85em; color: var(--ink-2); margin-left: auto; padding: 0 6px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
.sim-steps { display: flex; gap: 6px; flex-wrap: wrap; }
.sim-steps button { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: .35em .7em; font-size: .85em; display: inline-flex; gap: .4em; align-items: center; color: var(--ink-2); }
.sim-steps button.on { border-color: var(--brand); color: var(--brand-ink); background: var(--brand-soft); font-weight: 600; }
.sim-phones { display: grid; grid-template-columns: repeat(3, 228px); gap: 14px; }
.device { width: 228px; height: 470px; border-radius: 30px; padding: 8px; background: var(--bezel); box-shadow: var(--shadow); }
.device .screen { width: 100%; height: 100%; border-radius: 23px; overflow: hidden; background: var(--bg); }
.device .pv { font-size: 13px; }
.device .pv-body { padding: 12px; gap: 10px; }
.device .pv-head { padding: 10px 12px; }
.phone-cap { text-align: center; font-size: .8em; color: var(--ink-2); margin-top: 6px; }
@media (max-width: 1320px) {
  .sim { grid-template-columns: minmax(0, 1fr); }
  .sim-phones { grid-template-columns: repeat(auto-fit, 228px); justify-content: center; }
}
@media (max-width: 560px) {
  .sim-phones { grid-template-columns: 228px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}

.app.full { display: flex; flex-direction: column; }
.app.full > .pv { flex: 1; min-height: 0; height: auto; }
.app.full > .stage.full { flex: 1; min-height: 0; height: auto; }
.modebar.slim { padding: 8px 12px; gap: 10px; flex-wrap: nowrap; }
.modebar.slim .note { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ---------- account, room list, dev channel ---------- */
.home-top { display: flex; gap: 16px 24px; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; }
.home-top .home-hero { flex: 1 1 420px; min-width: 0; }
.acct { display: flex; align-items: center; gap: 10px 12px; flex-wrap: wrap; padding: 10px 12px; border-radius: var(--r); background: var(--surface); border: 1px solid var(--line); min-height: 52px; }
.avatar { width: 34px; height: 34px; border-radius: 50%; flex: none; object-fit: cover; }
.avatar.ph { display: grid; place-items: center; background: var(--navy-soft); color: var(--navy); font-weight: 600; text-transform: uppercase; }
.who { display: grid; line-height: 1.25; min-width: 0; }
.who b { font-weight: 600; font-size: .95em; }
.who span { font-size: .8em; color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.btn.google { background: var(--surface); border-color: var(--line); font-weight: 600; }
.btn.google .g { width: 18px; height: 18px; display: inline-grid; }
.btn.google .g svg { width: 18px; height: 18px; }
.rooms-card { grid-column: 1 / -1; }
.room-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 4px 4px 4px 0; border-radius: var(--r-sm); background: var(--surface-2); }
.room-main { display: grid; gap: 2px; padding: 8px 12px; text-decoration: none; color: var(--ink); min-width: 0; border-radius: var(--r-sm); }
.room-main:hover { background: var(--navy-soft); }
.room-main .rt { display: flex; gap: 6px; align-items: center; font-weight: 500; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.room-main .rm { font-size: .78em; color: var(--ink-3); }
.room-row .acts { display: flex; gap: 6px; align-items: center; padding-right: 6px; flex-wrap: wrap; justify-content: flex-end; }
.confirm-q { font-size: .85em; color: var(--bad); font-weight: 600; }
.pill.dev, .devbar b { background: #7C4DBF; color: #fff; }
.devbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 6px 16px; font-size: .82em; background: color-mix(in srgb, #7C4DBF 14%, var(--surface)); color: var(--ink); border-bottom: 1px solid var(--line); }
.devbar b { padding: .1em .55em; border-radius: 4px; font-size: .9em; letter-spacing: .05em; }
.devbar a { margin-left: auto; color: var(--navy); font-weight: 600; }

/* ---------- หน้าผู้เรียน (ใส่รหัสห้อง) ---------- */
.app.land-root { min-height: 100%; }
.landing { flex: 1; width: 100%; max-width: 1160px; margin: 0 auto; padding: 24px clamp(16px, 5vw, 72px) 24px; display: flex; flex-direction: column; }
.land-top { display: flex; align-items: center; font-size: 1.05rem; }
.land-hero { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 7vh 0 9vh; }
.land-bar { display: flex; align-items: center; gap: 12px 22px; width: min(100%, 700px); padding: 10px 10px 10px 32px; border-radius: 999px; background: #1B3A6B; color: #fff; box-shadow: 0 14px 34px -16px rgba(19, 33, 59, .55); }
.land-q { font-family: var(--f-display); font-weight: 700; font-size: 1.4rem; letter-spacing: -.01em; white-space: nowrap; cursor: pointer; }
.land-field { flex: 1; min-width: 0; display: flex; align-items: center; gap: 4px; padding: 5px 5px 5px 18px; border-radius: 999px; background: #fff; transition: box-shadow .15s; }
.land-field:focus-within { box-shadow: 0 0 0 3px #8FB0E8; }
.land-hash { font-family: var(--f-mono); font-weight: 600; font-size: 1.25rem; color: #1B3A6B; }
.land-input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: #13213B; padding: 8px 6px; font-family: var(--f-mono); font-size: 1.4rem; font-weight: 600; letter-spacing: .1em; }
.land-input::placeholder { font-family: var(--f-body); font-weight: 400; letter-spacing: 0; color: #8592AB; }
.land-go { flex: none; display: grid; place-items: center; width: 50px; height: 50px; border: 0; border-radius: 50%; background: #FF6B00; color: #fff; transition: filter .15s, transform .1s; }
.land-go svg.i { width: 24px; height: 24px; stroke-width: 2.2; }
.land-go:hover { filter: brightness(1.07); }
.land-go:active { transform: scale(.95); }
.land-go:disabled { opacity: .6; cursor: progress; }
.land-go:focus-visible { outline: 3px solid #fff; outline-offset: -6px; }
.land-msg { margin-top: 14px; min-height: 1.5em; font-size: .92em; color: var(--ink-3); }
.land-msg.bad { color: var(--bad); font-weight: 600; }
.land-recent { margin-top: 8px; display: inline-flex; align-items: center; gap: 8px; max-width: 100%; padding: 8px 12px 8px 16px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); text-decoration: none; font-size: .9em; }
.land-recent:hover { border-color: var(--navy); }
.land-recent b { font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.land-recent .mono { color: var(--ink-2); font-size: .92em; }
.land-title { margin-top: clamp(30px, 7vh, 64px); font-size: clamp(2.1rem, 6.6vw, 4.5rem); font-weight: 700; letter-spacing: -.025em; line-height: 1.14; }
.land-title span { display: inline-block; }
.land-title .hl { color: var(--brand); }
.land-sub { margin-top: 16px; max-width: 46ch; color: var(--ink-2); font-size: clamp(1rem, 2.2vw, 1.2rem); text-wrap: pretty; }
.land-foot { display: flex; justify-content: center; gap: 8px 18px; flex-wrap: wrap; font-size: .82em; color: var(--ink-3); }
.land-foot a { color: var(--ink-3); }
.land-foot a:hover { color: var(--ink-2); }
@media (max-width: 600px) {
  .land-hero { justify-content: flex-start; padding: 8vh 0 6vh; }
  .land-bar { flex-direction: column; align-items: stretch; gap: 12px; padding: 18px 12px 12px; border-radius: 22px; }
  .land-q { text-align: center; font-size: 1.2rem; }
  .land-input { font-size: 1.5rem; }
}

/* ---------- หลังบ้าน: หน้าล็อกอิน ---------- */
.home.gate { max-width: 460px; padding-top: 56px; }
.gate-card { justify-items: start; padding: 28px; gap: 14px; }
.gate-card h1 { font-size: 1.5rem; font-weight: 700; }
.gate-card .btn.google { justify-self: stretch; padding: .75em 1em; }
.pub-link { padding: 10px 12px; border-radius: var(--r-sm); background: var(--surface-2); color: var(--navy); font-weight: 600; overflow-wrap: anywhere; }
.hint a, .land-foot a { text-underline-offset: 2px; }
.hint a { color: var(--navy); font-weight: 500; }

/* ---------- มือถือผู้เรียนบนจอใหญ่: คอลัมน์กลางจอ ---------- */
@media (min-width: 700px) {
  .app.full > .pv { width: min(100% - 48px, 560px); margin: 28px auto; height: auto; flex: 1; border: 1px solid var(--line); border-radius: 18px; overflow: hidden; box-shadow: var(--shadow); }
}

/* ---------- ค้นหาห้อง ---------- */
.search-box { display: flex; align-items: center; gap: 8px; min-width: min(100%, 300px); padding: 0 12px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface); color: var(--ink-3); }
.search-box:focus-within { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
.search-box .input { border: 0; box-shadow: none; padding: .55em 0; background: transparent; flex: 1; min-width: 0; }
.search-box .input:focus { box-shadow: none; }

/* ---------- ธีมสีห้อง ---------- */
.themed { --brand: var(--th-a); --brand-ink: color-mix(in srgb, var(--th-a) 72%, #000); --brand-soft: color-mix(in srgb, var(--th-a) 12%, #fff); --on-brand: var(--th-on); --bar: var(--th-s); --navy: var(--th-s); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .themed { --brand-ink: color-mix(in srgb, var(--th-a) 60%, #fff); --brand-soft: color-mix(in srgb, var(--th-a) 22%, #121D31); --bar: color-mix(in srgb, var(--th-s) 35%, #fff); --navy: color-mix(in srgb, var(--th-s) 35%, #fff); } }
:root[data-theme="dark"] .themed { --brand-ink: color-mix(in srgb, var(--th-a) 60%, #fff); --brand-soft: color-mix(in srgb, var(--th-a) 22%, #121D31); --bar: color-mix(in srgb, var(--th-s) 35%, #fff); --navy: color-mix(in srgb, var(--th-s) 35%, #fff); }
.theme-dot { width: 14px; height: 14px; border-radius: 50%; background: var(--brand); box-shadow: 0 0 0 2px var(--surface), 0 0 0 3px var(--line); flex: none; }
.swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.swatch { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); text-align: left; font-weight: 500; font-size: .92em; }
.swatch:hover { border-color: var(--ink-3); }
.swatch.on { border-color: var(--a); box-shadow: 0 0 0 2px color-mix(in srgb, var(--a) 35%, transparent); }
.swatch i { width: 30px; height: 30px; border-radius: 8px; flex: none; display: grid; place-items: center; color: #fff; background: linear-gradient(135deg, var(--a) 0 62%, var(--s) 62% 100%); }
.swatch i svg.i { width: 18px; height: 18px; stroke-width: 2.6; }
.custom-color { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border: 1px dashed var(--line); border-radius: 10px; cursor: pointer; }
.custom-color input[type=color] { width: 42px; height: 34px; border: 0; padding: 0; background: none; cursor: pointer; }
.custom-color span { display: grid; gap: 2px; }

/* ---------- pop-up กลางจอ ---------- */
.modal { border: 0; padding: 0; margin: auto; width: min(560px, calc(100% - 32px)); max-height: calc(100dvh - 48px); border-radius: 18px; background: var(--surface); color: var(--ink); box-shadow: 0 30px 80px -24px rgba(5, 12, 26, .55); overflow: auto; }
.modal.wide { width: min(760px, calc(100% - 32px)); }
.modal::backdrop { background: rgba(11, 19, 34, .55); backdrop-filter: blur(3px); }
.modal[open] { animation: modalIn .18s ease-out; }
@keyframes modalIn { from { opacity: 0; transform: translateY(10px) scale(.98); } }
.modal-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 20px 22px 4px; }
.modal-head h2 { font-size: 1.25rem; font-weight: 700; }
.modal-body { padding: 12px 22px 24px; display: grid; gap: 16px; }
.typegrid.big { grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 10px; padding: 0; }
.typecard.big { flex-direction: row; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 12px; transition: border-color .15s, transform .1s, box-shadow .15s; }
.typecard.big:hover { box-shadow: var(--shadow); transform: translateY(-1px); }
.typecard.big .tc-ic { width: 44px; height: 44px; border-radius: 10px; display: grid; place-items: center; background: var(--surface-2); flex: none; }
.typecard.big .tc-ic svg { width: 24px; height: 24px; }
.typecard.big .tc-tx { display: grid; gap: 2px; }
.typecard.big .tc-tx b { font-family: var(--f-display); font-size: 1.05em; font-weight: 600; color: var(--ink); }
.typecard.big .tc-tx small { color: var(--ink-2); font-size: .88em; font-weight: 400; line-height: 1.4; }

/* ---------- ปุ่มบนแถบบนของห้อง ---------- */
.split { display: inline-flex; }
.split > .btn:first-child:not(:last-child) { border-top-right-radius: 0; border-bottom-right-radius: 0; }
.split > .btn:last-child:not(:first-child) { border-top-left-radius: 0; border-bottom-left-radius: 0; border-left: 1px solid color-mix(in srgb, var(--surface) 35%, transparent); padding-inline: .6em; }
.host-top .btn.on { border-color: var(--brand); background: var(--brand-soft); color: var(--brand-ink); }
.tools-info { font-size: .85em; padding: 0 .45em; border-radius: 99px; background: var(--brand); color: var(--on-brand); }
.toggle.sm { font-size: .85em; gap: 6px; }

/* ---------- หน้าต่างเครื่องมือ ---------- */
.tools { position: fixed; right: clamp(12px, 3vw, 36px); bottom: clamp(12px, 3vw, 36px); z-index: 60; width: min(370px, calc(100% - 24px)); max-height: min(80dvh, 720px); display: grid; grid-template-rows: auto minmax(0, 1fr); background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 24px 60px -18px rgba(19, 33, 59, .5); transition: transform .25s ease, opacity .2s; }
.tools.closed { transform: translateY(calc(100% + 60px)); opacity: 0; pointer-events: none; }
.tools-head { display: flex; align-items: center; gap: 8px; padding: 10px 10px 10px 16px; border-bottom: 1px solid var(--line); }
.tools-head b { display: inline-flex; align-items: center; gap: .5em; font-family: var(--f-display); font-weight: 600; }
.tools-head .spacer { flex: 1; }
.tools-body { overflow-y: auto; padding: 14px 16px 16px; display: grid; gap: 18px; }
.tool-sec { display: grid; gap: 10px; }
.tool-sec + .tool-sec { padding-top: 16px; border-top: 1px solid var(--line); }
.tool-sec h3 { display: flex; align-items: center; gap: .5em; font-size: .95em; }
.tm-big { font-size: 2.8rem; font-weight: 600; text-align: center; line-height: 1.1; letter-spacing: .02em; padding: 6px 0 0; }
.tm-big.low { color: var(--brand); }
.tm-big.done { color: var(--bad); animation: pulse 1s infinite; font-size: 2rem; font-family: var(--f-display); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); border-radius: 99px; padding: .3em .85em; font-size: .88em; font-weight: 500; }
.chip:hover { border-color: var(--brand); color: var(--brand-ink); }
.tools .input[type=number] { width: 90px; flex: none; }
.yt-box { aspect-ratio: 16 / 9; border-radius: 10px; overflow: hidden; background: #000; }
.yt-box > * { width: 100%; height: 100%; border: 0; display: block; }
.now { font-size: .88em; font-weight: 500; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.btn.on { border-color: var(--brand); color: var(--brand-ink); background: var(--brand-soft); }
.vol-wrap { color: var(--ink-3); flex: 1; min-width: 110px; }
.vol { flex: 1; min-width: 0; accent-color: var(--brand); }
.tracks { display: grid; gap: 6px; }
.track { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 6px; align-items: center; padding: 4px 6px; border-radius: 8px; background: var(--surface-2); }
.track.on { background: var(--brand-soft); }
.track .tt { font-size: .88em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ---------- ตัวจับเวลาบนจอ / มือถือ ---------- */
.st-timer { position: absolute; top: 1.15em; left: 50%; transform: translateX(-50%); z-index: 4; display: inline-flex; align-items: center; gap: .35em; padding: .25em .8em; border-radius: 99px; background: var(--surface); border: .06em solid var(--line); box-shadow: var(--shadow); font-family: var(--f-mono); font-weight: 600; font-size: 1.3em; color: var(--ink); font-variant-numeric: tabular-nums; }
.st-timer.low { background: var(--brand); color: var(--on-brand); border-color: transparent; }
.st-timer.done { background: var(--bad); color: #fff; border-color: transparent; font-family: var(--f-display); animation: pulse 1s infinite; }
.st-timer.paused { opacity: .75; }
.pv-head-r { display: flex; align-items: center; gap: 8px; flex: none; }
.pv-timer { display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px; border-radius: 99px; background: var(--surface-2); color: var(--ink); font-family: var(--f-mono); font-weight: 600; font-size: .82em; white-space: nowrap; font-variant-numeric: tabular-nums; }
.pv-timer svg.i { width: 14px; height: 14px; }
.pv-timer.low { background: var(--brand); color: var(--on-brand); }
.pv-timer.done { background: var(--bad-soft); color: var(--bad); font-family: var(--f-body); }

/* ---------- QR ปิดได้ ---------- */
.joinslide.noqr { grid-template-columns: minmax(0, 1fr); justify-items: center; text-align: center; }
.joinslide.noqr .big { justify-items: center; }
.joinslide.noqr .code { font-size: 5em; }

/* ---------- โหมดนำเสนอเต็มจอ ---------- */
.presenter { position: fixed; inset: 0; z-index: 90; display: flex; background: var(--surface); }
.presenter > .stage { flex: 1; height: 100%; }
body.presenting { overflow: hidden; }
.fs-hint { position: absolute; left: 50%; bottom: 3.2em; transform: translateX(-50%); z-index: 7; display: inline-flex; align-items: center; gap: .5em; padding: .6em 1.1em; border: 0; border-radius: 99px; background: var(--ink); color: var(--surface); font-size: 15px; font-weight: 500; box-shadow: var(--shadow); animation: toastIn .3s ease-out; }

/* ---------- ธีมทั้งห้อง (body.themed) ---------- */
body.themed { --room: var(--room-l); --on-room: var(--on-room-l); --bar-off: color-mix(in srgb, var(--brand) 30%, var(--surface)); background: var(--room); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) body.themed { --room: color-mix(in srgb, var(--th-a) 34%, #0B1322); --on-room: #ECF1F9; --bar-off: color-mix(in srgb, var(--brand) 38%, var(--surface)); } }
:root[data-theme="dark"] body.themed { --room: color-mix(in srgb, var(--th-a) 34%, #0B1322); --on-room: #ECF1F9; --bar-off: color-mix(in srgb, var(--brand) 38%, var(--surface)); }
body.themed .host-top, body.themed .host-side, body.themed .panel { box-shadow: 0 1px 2px rgba(0,0,0,.06), 0 10px 30px -18px rgba(0,0,0,.35); border-color: transparent; }

/* ---------- จอนำเสนอแบบกรอบสี + การ์ดขาว ---------- */
.st-top { display: flex; align-items: center; justify-content: space-between; gap: 1em; min-height: 1.9em; color: var(--on-room, var(--ink-2)); font-size: .84em; font-weight: 500; }
.st-top .tl, .st-top .tr { display: flex; align-items: center; gap: .5em; min-width: 0; white-space: nowrap; }
.st-top .tl > span:not(.pill):not(.brand) { overflow: hidden; text-overflow: ellipsis; }
.st-top .tl .pill { font-size: .8em; margin-left: .4em; }
.st-top .jn { opacity: .92; }
.st-top .jn b { font-weight: 700; }
.st-top .cnt { display: inline-flex; align-items: center; gap: .35em; margin-left: 1em; font-variant-numeric: tabular-nums; }
.st-card { min-height: 0; display: grid; background: var(--surface); border-radius: .75em; overflow: hidden; box-shadow: 0 .4em 1.6em -.8em rgba(0,0,0,.35); }
.st-body { display: grid; min-height: 0; }
.st-card .scene { gap: 0; }
.st-card .st-head { padding: .85em 1.3em .75em; border-bottom: .06em solid var(--line); }
.st-card .st-head .st-type { display: none; }
.st-card .scene > :last-child { padding: 1.1em 1.6em 1.2em; min-height: 0; }
.st-card .joinslide { padding: 1em 2.4em; }
.st-card .qa-st .st-type { display: inline-flex; }

/* รูปประกอบคำถามบนจอ */
.q-body { display: grid; min-height: 0; }
.q-media { display: none; }
.q-body.has-img { grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 1.6em; }
.q-body.has-img .q-media { display: grid; place-items: center; min-height: 0; }
.q-media img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: .45em; box-shadow: 0 .2em .9em -.4em rgba(0,0,0,.35); }
.q-body.has-img .quiz-opts { grid-template-columns: 1fr; }
.q-body.has-img .bars .br .lab { font-size: .9em; }

/* ตัวจับเวลาเต็มจอ */
.st-timer.big { position: absolute; inset: 0; transform: none; border-radius: 0; border: 0; box-shadow: none; flex-direction: column; justify-content: center; align-items: center; gap: .08em; background: var(--room, var(--surface)); color: var(--on-room, var(--ink)); font-size: 1em; animation: none; z-index: 6; padding: 0; }
.st-timer.big svg.i { width: 3em; height: 3em; opacity: .9; }
.st-timer.big .tm-num { font-family: var(--f-display); font-weight: 700; font-size: 11em; line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.st-timer.big.low .tm-num { animation: pulse 1s infinite; }
.st-timer.big.done .tm-num { font-size: 7em; }
.st-timer.big.paused .tm-num { opacity: .7; }
.st-timer.big .tm-x { position: absolute; top: 1em; right: 1em; font-size: 14px; opacity: 0; transition: opacity .3s; }
.stage.awake .st-timer.big .tm-x, .st-timer.big .tm-x:focus-visible { opacity: 1; }

/* ---------- มือถือผู้เรียนในห้อง: หัวบนพื้นสี การ์ดเนื้อหาสีอ่อน ---------- */
body.themed .pv { background: transparent; }
body.themed .pv-head { background: transparent; border-bottom: 0; color: var(--on-room); }
body.themed .pv-head .c { color: var(--on-room); opacity: .8; }
body.themed .pv-body { background: var(--bg); margin: 0 8px; border-radius: 18px 18px 0 0; }
body.themed .pv-tabs { margin: 0 8px; border-top: 1px solid var(--line); }
body.themed .app.full > .pv { border: 0; box-shadow: none; border-radius: 0; overflow: visible; }
@media (min-width: 700px) { body.themed .app.full > .pv { margin: 16px auto 24px; } body.themed .pv-tabs { border-radius: 0 0 18px 18px; } }
.pv-img { width: 100%; max-height: 42vh; object-fit: contain; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); }

/* ---------- หน้าต่างเครื่องมือ: ลากได้ ---------- */
.tools { z-index: 95; }
.tools.closed { transform: translateY(10px) scale(.98); visibility: hidden; transition: transform .2s ease, opacity .2s, visibility 0s linear .2s; }
.tools-head { cursor: grab; touch-action: none; user-select: none; }
.tools.dragging { transition: none; box-shadow: 0 30px 70px -18px rgba(19, 33, 59, .6); }
.tools.dragging .tools-head { cursor: grabbing; }
.grip { width: 10px; height: 16px; flex: none; opacity: .45; background: radial-gradient(circle, currentColor 1.2px, transparent 1.4px) 0 0 / 5px 5px; }

/* ---------- แนบรูปในตัวแก้ไข ---------- */
.img-drop { width: 100%; display: grid; justify-items: center; gap: 4px; padding: 16px 12px; border: 1.5px dashed var(--line); border-radius: 10px; background: var(--surface-2); color: var(--ink-2); text-align: center; }
.img-drop svg.i { width: 22px; height: 22px; color: var(--ink-3); }
.img-drop small { color: var(--ink-3); font-size: .8em; }
.img-drop:hover, .img-drop.over, .img-prev.over { border-color: var(--brand); background: var(--brand-soft); }
.img-prev { display: grid; gap: 8px; padding: 8px; border: 1.5px dashed transparent; border-radius: 10px; }
.img-prev img { width: 100%; max-height: 220px; object-fit: contain; border-radius: 8px; background: var(--surface-2); border: 1px solid var(--line); }

/* ---------- หน้าบ้านพื้นขาว ---------- */
body:has(.app.land-root), .app.land-root { background: var(--surface); }
.land-bar { position: relative; }

/* ---------- ตัวการ์ตูน Powerpointboy ---------- */
:where(img.av) { display: block; height: auto; pointer-events: none; user-select: none; -webkit-user-drag: none; }
@keyframes avIn { from { opacity: 0; transform: translateY(12px) scale(.94); } to { opacity: 1; transform: none; } }
@keyframes avBob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
:where(img.av) { animation: avIn .45s cubic-bezier(.2,.8,.2,1) both; }
.land-av { position: absolute; right: 34px; bottom: calc(100% - 16px); width: 92px; z-index: -1; }
.land-bar { isolation: isolate; }
.gate-card { position: relative; }
.gate-av { width: 118px; margin: -8px auto 2px; }
.card.has-av { position: relative; }
.card-av { position: absolute; right: 16px; top: -28px; width: 70px; }
.side-av { margin-top: auto; padding-top: 14px; display: grid; justify-items: center; gap: 6px; text-align: center; color: var(--ink-3); font-size: .8em; line-height: 1.35; }
.side-av img.av { width: 86px; }
.join-av { position: absolute; right: .4em; bottom: 0; height: 40cqh; width: auto; z-index: -1; opacity: .98; }
.joinslide { position: relative; }
.joinslide:not(.noqr) .join-av { right: auto; left: 52%; height: 30cqh; transform: translateX(-50%); }
.note-av { width: 6.5em; }

/* มือถือ */
.pv-av-lg { width: 112px; margin-bottom: -4px; }
.pv-card.has-av { position: relative; margin-top: 34px; }
.pv-av-peek { position: absolute; right: 12px; top: -64px; width: 78px; }
.pv-av-corner { position: absolute; right: 10px; top: -46px; width: 56px; }
@media (prefers-reduced-motion: no-preference) { .pv-av-lg { animation: avIn .45s cubic-bezier(.2,.8,.2,1) both, avBob 3.2s ease-in-out .5s infinite; } }

/* ---------- นับถอยหลังก่อนเริ่มข้อ ---------- */
.scene.countdown { grid-template-rows: minmax(0, 1fr); }
.cd { display: grid; place-content: center; justify-items: center; gap: .5em; text-align: center; padding: 1em; }
.cd-kick { display: inline-flex; align-items: center; gap: .45em; padding: .3em .9em; border-radius: 99px; background: var(--brand-soft); color: var(--brand-ink); font-weight: 600; font-size: .95em; }
.cd-q { font-family: var(--f-display); font-weight: 600; font-size: 1.7em; line-height: 1.25; max-width: 26ch; text-wrap: balance; }
.cd-num { display: grid; place-items: center; width: 2.1em; height: 2.1em; margin-top: .15em; border-radius: 50%; background: var(--brand); color: var(--on-brand); font-family: var(--f-display); font-weight: 700; font-size: 4.2em; line-height: 1; font-variant-numeric: tabular-nums; box-shadow: 0 .25em .8em -.3em color-mix(in srgb, var(--brand) 70%, transparent); }
.cd-num.pop { animation: cdPop .55s cubic-bezier(.2,1.6,.4,1); }
@keyframes cdPop { 0% { transform: scale(.4); opacity: .2; } 60% { transform: scale(1.12); opacity: 1; } 100% { transform: scale(1); } }
.pv-count { display: grid; place-items: center; width: 92px; height: 92px; border-radius: 50%; background: var(--brand); color: var(--on-brand); font-family: var(--f-display); font-weight: 700; font-size: 3em; line-height: 1; font-variant-numeric: tabular-nums; }

/* ---------- ห้องรอ Quiz ---------- */
.scene.lobby { grid-template-rows: auto minmax(0, 1fr); gap: 0; }
.lobby-top { display: flex; align-items: center; justify-content: space-between; gap: 1.5em; padding: 1em 1.6em; border-bottom: .06em solid var(--line); }
.lobby-join { display: grid; grid-template-columns: auto auto; align-items: baseline; gap: .1em .7em; }
.lobby-join .eyebrow { font-size: .8em; color: var(--ink-2); font-weight: 500; }
.lobby-join .url { font-family: var(--f-display); font-weight: 600; font-size: 1.35em; }
.lobby-join .code { font-family: var(--f-mono); font-weight: 600; font-size: 2.2em; color: var(--brand); letter-spacing: .06em; line-height: 1.05; }
.lobby-count { display: flex; align-items: center; gap: .6em; }
.lobby-count > div { display: grid; justify-items: center; line-height: 1; }
.lobby-count b { font-family: var(--f-display); font-size: 3em; font-weight: 700; font-variant-numeric: tabular-nums; }
.lobby-count span { font-size: .85em; color: var(--ink-2); margin-top: .2em; }
.lobby-av { height: 4.6em; width: auto; animation: avIn .45s both, avBob 2.6s ease-in-out .5s infinite; }
.lobby-list { min-height: 0; overflow: hidden; display: grid; align-content: start; }
.lobby-names { display: flex; flex-wrap: wrap; gap: .5em; align-content: flex-start; }
.lobby-chip { padding: .35em .9em; border-radius: 99px; background: var(--surface-2); border: .06em solid var(--line); font-weight: 600; font-size: 1.05em; animation: chipIn .4s cubic-bezier(.2,1.5,.4,1) both; }
.lobby-chip:nth-child(3n+1) { background: var(--brand-soft); border-color: transparent; color: var(--brand-ink); }
@keyframes chipIn { from { transform: scale(.3); opacity: 0; } to { transform: none; opacity: 1; } }
.lobby-empty { display: grid; place-items: center; height: 100%; min-height: 4em; color: var(--ink-3); font-size: 1.1em; }
.lobby-me .pts { font-size: 1.8em; color: var(--ink); overflow-wrap: anywhere; }

/* ---------- อันดับหลังแต่ละข้อ + โพเดียม ---------- */
.board .lr { grid-template-columns: 2.2em minmax(0, 1fr) auto auto; }
.board .lr .dl { font-family: var(--f-display); font-weight: 600; font-size: .8em; color: var(--good); font-variant-numeric: tabular-nums; }
.board .lr.r1 .dl { color: var(--on-brand); opacity: .9; }
.board .lr .dl[data-up="1"]::before { content: '▲ '; font-size: .8em; }
.podium { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); align-items: end; gap: 1em; padding: 0 2em; min-height: 0; }
.pod { display: grid; justify-items: center; align-content: end; gap: .2em; text-align: center; min-width: 0; animation: podIn .7s cubic-bezier(.2,.8,.2,1) both; }
.pod.p3 { animation-delay: .3s; } .pod.p2 { animation-delay: .9s; } .pod.p1 { animation-delay: 1.6s; }
@keyframes podIn { from { opacity: 0; transform: translateY(40%); } to { opacity: 1; transform: none; } }
.pod-name { font-family: var(--f-display); font-weight: 700; font-size: 1.25em; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pod-pts { font-size: .85em; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.pod-bar { width: 100%; display: grid; place-items: start center; padding-top: .3em; border-radius: .4em .4em 0 0; background: var(--navy-soft); color: var(--ink); font-family: var(--f-display); font-weight: 700; font-size: 2.2em; }
.pod.p1 .pod-bar { height: 4.6em; background: var(--brand); color: var(--on-brand); font-size: 2.6em; height: 3.6em; }
.pod.p2 .pod-bar { height: 2.6em; }
.pod.p3 .pod-bar { height: 1.8em; }
.pod.p1 .pod-name { font-size: 1.5em; }
.pod-av { height: 5.5em; width: auto; margin-bottom: .2em; }
.pod-rest { grid-column: 1 / -1; display: flex; flex-wrap: wrap; justify-content: center; gap: .3em 1.2em; padding: .5em 0 0; font-size: .85em; color: var(--ink-2); border-top: .06em solid var(--line); animation: avIn .5s 2.2s both; }

/* ---------- เฉลยคำตอบในแท่งกราฟ ---------- */
.br .lab .ok { display: inline-grid; place-items: center; width: 1.3em; height: 1.3em; border-radius: 50%; background: var(--good); color: #fff; margin-left: .2em; }
.br .lab .ok[hidden] { display: none; }
.br .lab .ok svg.i { width: .8em; height: .8em; stroke-width: 3; }
.mini-bars .mb.ok .trk i { background: var(--good); }
.mini-bars .mb.ok .top span:first-child::after { content: ' ✓'; color: var(--good); font-weight: 700; }
.key-btn { display: inline-grid; place-items: center; }

/* ---------- เพลงประกอบ Quiz ในแผงเครื่องมือ ---------- */
.qm-box { display: grid; gap: 8px; padding: 10px 12px; border-radius: 10px; background: var(--surface-2); }
.qm-box .toggle span { display: grid; gap: 1px; }
.qm-box .toggle small { color: var(--ink-3); font-size: .78em; font-weight: 400; }

/* ---------- จับเวลาแบบจอเล็ก ---------- */
.mini-bar { display: none; gap: 6px; justify-content: center; flex-wrap: wrap; }
.mini-bar .btn { min-width: 40px; padding-inline: 10px; }
.tools.mini { width: 250px; }
.tools.mini .tools-head { padding: 6px 6px 6px 12px; }
.tools.mini .tools-body { padding: 6px 12px 12px; gap: 0; overflow: visible; }
.tools.mini .tool-sec.tm-sec { gap: 8px; }
.tools.mini .tool-sec.tm-sec > :not(.tm-big):not(.mini-bar) { display: none; }
.tools.mini .mini-bar { display: flex; }
.tools.mini .tm-big { font-size: 3.4rem; padding: 0; }
.tools.mini .tool-sec.music { position: absolute; left: -10000px; top: 0; width: 340px; }
/* หน้าต่างปักหมุด (Picture-in-Picture) */
body.pip { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--room, var(--surface)); color: var(--on-room, var(--ink)); overflow: hidden; }
.pip-wrap { display: grid; gap: 8px; justify-items: center; padding: 8px; }
.pip-wrap .tm-big { font-size: min(30vw, 46vh); padding: 0; line-height: 1; }
.pip-wrap .tm-big.done { font-size: min(16vw, 26vh); }
.pip-wrap .mini-bar { display: flex; }
body.pip .mini-bar .btn { background: var(--surface); color: var(--ink); border-color: var(--line); }
body.pip .mini-bar .btn.primary { background: var(--brand); color: var(--on-brand); border-color: transparent; }

</style>

// มือถือผู้เรียนบน Firebase: ฟังเฉพาะข้อมูลที่ต้องใช้ ไม่โหลดคำตอบของคนอื่น
class PhoneFeed {
  constructor(db, code, pid, cb) {
    Object.assign(this, { db, code, pid, cb, offs: {}, got: new Set(), active: undefined, queued: false });
    this.t = { __feed: true, meta: null, qs: {}, ppl: {}, res: {}, agg: {}, score: {}, qa: {}, img: {} };
    this.sub('meta', 'meta', v => { this.t.meta = v; this.retarget(); });
    this.sub('qs', 'qs', v => { this.t.qs = v || {}; });
    this.sub('ppl', `ppl/${pid}`, v => { this.t.ppl = v ? { [pid]: v } : {}; });
    this.sub('score', `score/${pid}`, v => { this.t.score = v ? { [pid]: v } : {}; });
  }
  sub(key, path, fn) { this.unsub(key); this.offs[key] = this.db.listenPath(`events/${this.code}/${path}`, v => { fn(v); this.got.add(key); this.emit(); }); }
  unsub(key) { if (this.offs[key]) { this.offs[key](); delete this.offs[key]; } this.got.delete(key); }
  retarget() {
    const a = this.t.meta?.active || null; if (a === this.active) return;
    this.active = a; this.t.res = {}; this.t.agg = {}; this.t.img = {};
    if (!a) { this.unsub('res'); this.unsub('agg'); this.unsub('img'); return; }
    this.sub('img', `img/${a}`, v => { this.t.img = v ? { [a]: v } : {}; });
    this.sub('res', `res/${a}/${this.pid}`, v => { this.t.res = v ? { [a]: { [this.pid]: v } } : {}; });
    this.sub('agg', `agg/${a}`, v => { this.t.agg = v ? { [a]: v } : {}; });
  }
  setQA(on) { if (on === !!this.offs.qa) return; if (on) this.sub('qa', 'qa', v => { this.t.qa = v || {}; }); else { this.unsub('qa'); this.t.qa = {}; } }
  emit() {
    if (!this.got.has('meta')) return;
    if (this.t.meta && !['meta', 'qs', 'ppl', ...(this.active ? ['res'] : [])].every(k => this.got.has(k))) return;
    if (this.queued) return; this.queued = true;
    queueMicrotask(() => { this.queued = false; this.cb(this.t.meta ? this.t : null); });
  }
  destroy() { Object.keys(this.offs).forEach(k => this.unsub(k)); }
}

/* ---------------- domain ---------------- */
const TYPES = {
  mc: { name: 'Multiple choice', th: 'โพลเลือกตอบ', icon: 'mc', cls: 't-mc' },
  cloud: { name: 'Word cloud', th: 'Word cloud', icon: 'cloud', cls: 't-cloud' },
  open: { name: 'Open text', th: 'คำถามปลายเปิด', icon: 'open', cls: 't-open' },
  quiz: { name: 'Quiz', th: 'Quiz แข่งเวลา', icon: 'quiz', cls: 't-quiz' },
};
const LETTERS = 'ABCDEF';
const asArr = x => Array.isArray(x) ? x : (x && typeof x === 'object') ? Object.keys(x).sort((a, b) => a - b).map(k => x[k]) : [];
const qList = t => Object.entries(t?.qs || {}).map(([id, q]) => ({ id, ...q })).sort((a, b) => (a.ord || 0) - (b.ord || 0));
const getQ = (t, id) => (id && t?.qs?.[id]) ? { id, ...t.qs[id] } : null;
const respMap = (t, qid) => t?.res?.[qid] || {};
const respCount = (t, qid) => Object.keys(respMap(t, qid)).length;
const pplCount = t => Object.keys(t?.ppl || {}).length;
const choiceIdx = v => Array.isArray(v) ? v : typeof v === 'number' ? [v] : (v && typeof v === 'object') ? asArr(v) : [];
const entries = r => asArr(r?.v).filter(x => typeof x === 'string' && x.trim());
const norm = s => s.normalize('NFC').trim().replace(/\s+/g, ' ').toLowerCase();
const optLabel = (q, i) => asArr(q.opts)[i] || `ตัวเลือก ${LETTERS[i]}`;
function tally(t, q) {
  const opts = asArr(q.opts); const counts = opts.map(() => 0); let people = 0;
  for (const r of Object.values(respMap(t, q.id))) {
    const idx = choiceIdx(r.v); if (!idx.length) continue; people++;
    idx.forEach(i => { if (counts[i] != null) counts[i]++; });
  }
  return { opts, counts, people };
}
function cloudCounts(t, q) {
  const hid = q.hid || {}; const m = new Map();
  for (const r of Object.values(respMap(t, q.id))) for (const raw of entries(r)) {
    const k = norm(raw); if (!k || hid[hash(k)]) continue;
    const e = m.get(k) || { k, n: 0, forms: {} }; e.n++; const f = raw.trim(); e.forms[f] = (e.forms[f] || 0) + 1; m.set(k, e);
  }
  return [...m.values()].map(e => ({ k: e.k, n: e.n, text: Object.entries(e.forms).sort((a, b) => b[1] - a[1])[0][0] }))
    .sort((a, b) => b.n - a.n || a.k.localeCompare(b.k, 'th'));
}
function openList(t, q) {
  const hid = q.hid || {}; const out = [];
  for (const [pid, r] of Object.entries(respMap(t, q.id))) {
    const ts = asArr(r.t);
    entries(r).forEach((text, i) => { const key = pid + '_' + i; out.push({ key, text, at: ts[i] || r.at || 0, hidden: !!hid[key] }); });
  }
  return out.sort((a, b) => b.at - a.at);
}
const quizLimit = q => (q.limit || 20) * 1000;
const QUIZ_COUNT = 4000; // นับถอยหลัง 3-2-1 ก่อนเริ่มแต่ละข้อ
function quizPhase(q, now) { if (!q.start) return 'ready'; if (q.end) return 'ended'; if (now < q.start) return 'count'; return now >= q.start + quizLimit(q) ? 'ended' : 'live'; }
const quizLeft = (q, now) => q.start ? Math.max(0, Math.min(quizLimit(q), q.start + quizLimit(q) - now)) : quizLimit(q);
const ansList = a => a == null ? [] : Array.isArray(a) ? a : typeof a === 'object' ? asArr(a) : [a];
// คนที่ออนไลน์อยู่จริง (มือถือเปิดหน้าห้องค้างไว้) · ห้องจำลองในเครื่องนับจากรายชื่อ
const onlineIds = (t, db) => db?.kind === 'local' ? Object.keys(t?.ppl || {}) : Object.keys(t?.on || {}).filter(k => t?.ppl?.[k]);
const roomCount = (t, db) => onlineIds(t, db).length;
const quizPlayers = (t, db) => onlineIds(t, db).filter(k => t.ppl?.[k]?.n);
const ansOf = (t, q) => t?.keys?.[q.id] ?? q.ans;
function quizPoints(q, r, ans) {
  if (!r || typeof r.v !== 'number' || ans == null || r.v !== ans) return 0;
  const lim = quizLimit(q);
  const srv = typeof r.at === 'number' && q.start ? r.at - q.start - 1500 : 0; // กันการแก้เวลาจากฝั่งมือถือ
  const ms = Math.min(Math.max(r.ms || 0, srv, 0), lim);
  return Math.round(1000 * (1 - (ms / lim) / 2));
}
function leaderboard(t, endedOnly = false, now = Date.now()) {
  const tot = {};
  for (const q of qList(t)) {
    if (q.t !== 'quiz' || (endedOnly && quizPhase(q, now) !== 'ended')) continue;
    const ans = ansOf(t, q);
    for (const [pid, r] of Object.entries(respMap(t, q.id))) {
      const p = tot[pid] || (tot[pid] = { pid, pts: 0, ok: 0, n: 0 }); const pts = quizPoints(q, r, ans);
      p.n++; p.pts += pts; if (pts > 0) p.ok++;
    }
  }
  const ppl = t?.ppl || {};
  return Object.values(tot).map(p => ({ ...p, name: ppl[p.pid]?.n || 'ไม่ระบุชื่อ' }))
    .sort((a, b) => b.pts - a.pts || b.ok - a.ok || a.name.localeCompare(b.name, 'th'));
}
function qaList(t, sort = 'top') {
  return Object.entries(t?.qa || {}).map(([id, x]) => ({ id, ...x, votes: Object.keys(x.up || {}).length }))
    .sort(sort === 'new' ? (a, b) => (b.at || 0) - (a.at || 0) : (a, b) => b.votes - a.votes || (b.at || 0) - (a.at || 0));
}

const Act = {
  activate(db, code, q) {
    const u = { 'meta/active': q.id, 'meta/mode': 'q', 'meta/ts': TS };
    if (q.t === 'quiz' && !q.start) { u[`qs/${q.id}/start`] = Math.round(db.now() + QUIZ_COUNT); u[`qs/${q.id}/end`] = null; u[`qs/${q.id}/ans`] = null; u['meta/lobbyDone'] = true; }
    return write(db, code, u);
  },
  // Quiz ข้อแรกของชุด: เปิดห้องรอให้ผู้เรียนใส่ชื่อก่อน ข้อต่อไปเริ่มนับถอยหลังเลย
  lobby: (db, code, q) => write(db, code, { 'meta/mode': 'lobby', 'meta/active': q.id, 'meta/ts': TS }),
  go(db, code, t, q) { return q.t === 'quiz' && !q.start && !t?.meta?.lobbyDone ? Act.lobby(db, code, q) : Act.activate(db, code, q); },
  reveal: (db, code, t, q) => write(db, code, { [`qs/${q.id}/ans`]: ansList(t?.keys?.[q.id]).length ? ansList(t.keys[q.id]) : null, [`qs/${q.id}/closed`]: true }),
  unreveal: (db, code, q) => write(db, code, { [`qs/${q.id}/ans`]: null }),
  resetQuizzes(db, code, t) {
    const u = { 'meta/lobbyDone': null };
    for (const q of qList(t)) if (q.t === 'quiz') Object.assign(u, { [`res/${q.id}`]: null, [`qs/${q.id}/start`]: null, [`qs/${q.id}/end`]: null, [`qs/${q.id}/ans`]: null });
    for (const k of Object.keys(t?.score || {})) u[`score/${k}`] = null;
    return write(db, code, u);
  },
  offscreen: (db, code) => write(db, code, { 'meta/active': null, 'meta/mode': 'join', 'meta/ts': TS }),
  mode: (db, code, m) => write(db, code, { 'meta/mode': m, 'meta/ts': TS }),
  restartQuiz: (db, code, q) => write(db, code, { [`res/${q.id}`]: null, [`qs/${q.id}/start`]: Math.round(db.now() + QUIZ_COUNT), [`qs/${q.id}/end`]: null, [`qs/${q.id}/ans`]: null, 'meta/active': q.id, 'meta/mode': 'q', 'meta/ts': TS }),
  clear(db, code, t, q) {
    const u = { [`res/${q.id}`]: null, [`qs/${q.id}/hid`]: null };
    if (q.t === 'quiz') { const live = t.meta?.active === q.id; u[`qs/${q.id}/start`] = live ? Math.round(db.now() + QUIZ_COUNT) : null; u[`qs/${q.id}/end`] = null; u[`qs/${q.id}/ans`] = null; }
    else u[`agg/${q.id}`] = null;
    return write(db, code, u);
  },
  nav(db, code, t, dir) {
    const qs = qList(t); const m = t?.meta || {}; const i = qs.findIndex(q => q.id === m.active); const cur = qs[i];
    if (dir > 0) {
      if (m.mode === 'lobby' && cur) return Act.activate(db, code, cur);
      const ph = cur?.t === 'quiz' ? quizPhase(cur, db.now()) : '';
      if (m.mode === 'q' && ph === 'live') return write(db, code, { [`qs/${cur.id}/end`]: TS }); // ข้ามเวลาที่เหลือ
      if (m.mode === 'q' && ph === 'count') return null;
      if (m.mode === 'q' && ph === 'ended') return Act.mode(db, code, 'board');
      if (m.mode === 'q' && cur?.t === 'mc' && ansList(t.keys?.[cur.id]).length && cur.ans == null) return Act.reveal(db, code, t, cur); // คลิกแรกเฉลย คลิกต่อไปข้อถัดไป
      if (m.mode === 'qa') return cur ? Act.mode(db, code, 'q') : qs[0] && Act.go(db, code, t, qs[0]);
      if (m.mode === 'join' || !cur) return qs[0] ? Act.go(db, code, t, qs[0]) : null;
      if (qs[i + 1]) return Act.go(db, code, t, qs[i + 1]);
      toast('ถึงคำถามสุดท้ายแล้ว'); return null;
    }

    if (m.mode === 'board' && cur) return Act.mode(db, code, 'q');
    if (m.mode === 'qa') return cur ? Act.mode(db, code, 'q') : Act.offscreen(db, code);
    if (!cur || i === 0) return Act.offscreen(db, code);
