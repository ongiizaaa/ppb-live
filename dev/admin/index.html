  toggleHide(db, code, t) { const q = getQ(t, t?.meta?.active); if (q) write(db, code, { [`qs/${q.id}/hide`]: !q.hide || null }); },
};

// ผู้ช่วยฝั่งผู้จัด (รันบนแผงควบคุมหรือจอนำเสนอเครื่องเดียว): สรุปผลโหวต เฉลย Quiz และคิดคะแนน แล้วส่งให้มือถือแบบย่อ
class Agent {
  constructor(db, code) { Object.assign(this, { db, code, id: rid(8), t: null, last: {}, busy: false }); this.tick = setInterval(() => this.run(), 1000); }
  set(t) { this.t = t; }
  async run() {
    const t = this.t; if (!t?.meta || this.busy) return;
    const now = this.db.now(); const lead = t.ctl?.lead; const age = now - (lead?.at || 0); const mine = lead?.id === this.id;
    if (!lead || age > 12000 || (mine && age > 4000)) { this.busy = true; await this.db.update(this.code, { 'ctl/lead': { id: this.id, at: TS } }).catch(() => {}); this.busy = false; if (!mine) return; }
    if (!mine) return;
    const u = {}; const put = (k, v) => { const sv = JSON.stringify(v ?? null); if (this.last[k] !== sv) { u[k] = v ?? null; this.last[k] = sv; } };
    for (const q of qList(t)) if (q.t === 'quiz') { const want = quizPhase(q, now) === 'ended' ? (t.keys?.[q.id] ?? null) : null; if ((q.ans ?? null) !== want) u[`qs/${q.id}/ans`] = want; }
    const q = getQ(t, t.meta.active);
    if (q?.t === 'mc') { const T = tally(t, q); put(`agg/${q.id}`, { c: T.counts, n: T.people }); }
    if (q?.t === 'quiz' && t.meta.mode === 'q' && quizPhase(q, now) === 'live' && this.endedEarly !== q.id + q.start) {
      const players = quizPlayers(t, this.db); const res = respMap(t, q.id);
      if (players.length && players.every(pid => res[pid])) { this.endedEarly = q.id + q.start; u[`qs/${q.id}/end`] = TS; }
    }
    const ended = qList(t).filter(x => x.t === 'quiz' && quizPhase(x, now) === 'ended').length;
    const lb = leaderboard(t, true, now); const seen = new Set();
    lb.forEach((p, i) => { seen.add('score/' + p.pid); put('score/' + p.pid, { pts: p.pts, rank: i + 1, of: lb.length, k: ended }); });
    for (const k of Object.keys(this.last)) if (k.startsWith('score/') && !seen.has(k) && this.last[k] !== 'null') put(k, null);
    put('meta/qaN', qaList(t).filter(x => !x.done).length);
    if (!Object.keys(u).length) return;
    this.busy = true;
    try { await this.db.update(this.code, u); } catch (e) { console.error(e); this.last = {}; }
    this.busy = false;
  }
  destroy() { clearInterval(this.tick); }
}

function CloudScene(q) {
  const head = sceneHead(q); const box = h('div', { class: 'cloud' }); const hidden = hiddenNote();
  const empty = h('div', { class: 'hidden-note', hidden: true }, icon('cloud'), h('b', null, 'รอคำตอบแรก'), h('span', null, 'คำที่ตอบซ้ำกันจะตัวใหญ่ขึ้น'));
  const media = qMedia(h('div', { style: { display: 'grid', minHeight: '0' } }, box, hidden.el, empty));
  const el = h('div', { class: 'scene' }, head.el, media.el);
  const spans = new Map(); let words = []; let sig = ''; let timer = 0; let ctx = null;
  function layout() {
    const W = box.clientWidth, H = box.clientHeight; if (!W || !H) return;

    if (!list.length) { spans.forEach(s => s.remove()); spans.clear(); return; }

          if (rad * Math.min(1, 1 / ax) > Math.max(W, H)) break;
          if (x < 0 || y < 0 || x + tw > W || y + th > H) continue;

      if (!s) { s = h('span', { class: 'w new' }); spans.set(p.word.k, s); box.append(s); }
      s.textContent = p.word.text; s.style.fontSize = p.fs.toFixed(1) + 'px';
      s.style.transform = `translate(${p.tx.toFixed(1)}px, ${(p.ty + p.fs * 0.05).toFixed(1)}px)`;
      s.className = 'w c' + (p.rank === 0 ? 0 : 1 + (parseInt(hash(p.word.k).slice(1), 36) % 4)) + (fresh ? ' new' : '');
      if (fresh) requestAnimationFrame(() => requestAnimationFrame(() => s.classList.remove('new')));
    }
    spans.forEach((s, k) => { if (!keep.has(k)) { s.remove(); spans.delete(k); } });

  document.fonts?.ready?.then(schedule);

    el, count: (t, q) => respCount(t, q.id),
    update(t, q) {
      head.setText(q.text); media.set(t.img?.[q.id]);
      box.hidden = !!q.hide; hidden.el.hidden = !q.hide; hidden.set(respCount(t, q.id));
      const w = cloudCounts(t, q); const s = w.map(x => x.k + ':' + x.n).join('|');

}

      const items = qaList(cur); const bot = 'bot-' + Math.floor(Math.random() * 20);
      if (i % 3 === 0) await write(db, code, { [`qa/${rid()}`]: { text: pick(POOLS.qa), by: bot, n: Math.random() < .5 ? '' : pick(BOT_NAMES), at: TS } });
      else if (items.length) await write(db, code, { [`qa/${pick(items).id}/up/${bot}`]: true });
      await sleep(180);
    }
    return;
  }
  const q = getQ(t, m.active);
  if (!q || m.mode !== 'q') return toast('เลือกคำถามขึ้นจอก่อน แล้วค่อยจำลองคนตอบ');

  const opts = asArr(q.opts); const ws = opts.map((_, i) => [3, 6, 4, 2, 2, 1][i] || 1);

    const pid = 'bot-' + i; const u = {}; if (!t.ppl?.[pid]) u[`ppl/${pid}`] = { n: BOT_NAMES[i % BOT_NAMES.length], at: TS };
    const tnow = db.now();
    if (q.t === 'mc') u[`res/${q.id}/${pid}`] = { v: q.multi ? [...new Set([weighted(ws), weighted(ws)])].sort() : weighted(ws), at: TS };
    if (q.t === 'quiz') { const ans = ansOf(t, q) ?? 0; const correct = Math.random() < .68; const v = correct ? ans : pick(opts.map((_, j) => j).filter(j => j !== ans)); u[`res/${q.id}/${pid}`] = { v, ms: Math.min(quizLimit(q) - 200, Math.max(0, tnow - q.start) + Math.round(800 + Math.random() * 3000)), at: TS }; }
    if (q.t === 'cloud') { const k = 1 + Math.floor(Math.random() * Math.min(3, q.max || 3)); const s = new Set(); while (s.size < k) s.add(pick(POOLS.cloud)); u[`res/${q.id}/${pid}`] = { v: [...s], t: [...s].map(() => tnow), at: TS }; }

}

async function exportXlsx(t, code) {
  if (!t?.meta) return;
  if (IN_FRAME) return toast('ดาวน์โหลดได้เมื่อเปิดจากไฟล์หรือเว็บของคุณ');

  const sum = [['ข้อ', 'ประเภท', 'คำถาม', 'ตัวเลือก / คำตอบ', 'จำนวน', 'สัดส่วน']]; const raw = [['ข้อ', 'ประเภท', 'คำถาม', 'ผู้ตอบ', 'คำตอบ', 'เวลา']];
  qList(t).forEach((q, i) => {
    const no = i + 1, ty = TYPES[q.t].name, tx = q.text || '';

      if (q.t === 'mc' || q.t === 'quiz') raw.push([no, ty, tx, who, choiceIdx(r.v).map(j => `${LETTERS[j]}. ${optLabel(q, j)}`).join(', ') + (q.t === 'quiz' ? ` (${quizPoints(q, r, ansOf(t, q))} คะแนน)` : ''), fmtT(r.at)]);

let current = null; let forced = null;
function parseRoute() {

  const start = !IS_LIVE ? 'demo' : IS_ADMIN_PATH ? 'admin' : 'home';
  if (!raw) return { v: start };
  if (raw === 'admin' || raw === 'demo') return { v: raw };
  if (raw === 'home') return { v: IS_ADMIN_PATH ? 'admin' : 'home' };
  const m = raw.match(/^(host|screen|join)[-/]([a-z0-9]+)$/i);
  if (m) return { v: m[1].toLowerCase(), code: m[2].toLowerCase() };
  if (/^\d{6}$/.test(raw)) return { v: 'join', code: raw };

}

  if (r.v === 'demo' || r.code === 'demo') await ensureDemo(false);
  if (db !== LOCAL) {
    root.append(h('div', { class: 'wait', style: { margin: 'auto' } }, h('div', { class: 'wait-art' }, h('i'), h('i'), h('i')), 'กำลังเชื่อมต่อ…'));
    try { await db.ready; } catch (e) { console.error(e); root.replaceChildren(h('main', { class: 'home', style: { maxWidth: '560px' } }, brand(), h('section', { class: 'card' }, h('h2', null, 'เชื่อมต่อ Firebase ไม่สำเร็จ'), h('p', { class: 'muted' }, 'ตรวจว่าเปิด Anonymous sign-in ใน Firebase Authentication แล้ว และ firebaseConfig ถูกต้อง'), h('code', { class: 'mono', style: { fontSize: '.8em', overflowWrap: 'anywhere' } }, String(e?.message || e)), h('a', { class: 'btn', href: '#demo' }, 'เปิดห้องเรียนจำลองแทน')))); return; }
    root.replaceChildren();
  }
  if (CHANNEL === 'dev' && r.v !== 'screen') root.append(h('div', { class: 'devbar' }, h('b', null, 'DEV'), h('span', null, 'หน้าทดสอบ · ใช้ฐานข้อมูลเดียวกับเว็บจริง'), h('a', { href: location.pathname.replace(/\/dev(\/|$)/, '/') + location.hash }, 'ไปเว็บจริง')));
  document.title = (CHANNEL === 'dev' ? '[DEV] ' : '') + { demo: 'ห้องเรียนจำลอง', home: 'Powerpointboy Live', admin: 'หลังบ้าน', host: 'แผงควบคุม', screen: 'จอนำเสนอ', join: 'เข้าร่วม' }[r.v] + (r.code && r.code !== 'demo' ? ' · ' + fmtCode(r.code) : '') + (r.v === 'home' ? '' : ' — Powerpointboy Live');
  if (r.v === 'demo') current = new DemoView(root);
  else if (r.v === 'home') current = new LandingView(root);
  else if (r.v === 'admin') current = new HomeView(root);
  else if (r.v === 'join') current = new JoinView(root, r.code, db);
  else {
    const own = await db.isOwner(r.code) && (db === LOCAL || isAdmin(db.user));
    if (r.v === 'host') current = own ? new HostView(root, r.code, db) : new ClaimView(root, r.code, db, () => route());
    else current = own || db === LOCAL ? new ScreenView(root, r.code, db, own) : new ClaimView(root, r.code, db, () => route());
  }
}
addEventListener('hashchange', () => route());
route();

</script>
